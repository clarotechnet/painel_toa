name: dominium-toa

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    env_file:
      - ${DOMINIUM_ENV_FILE:-.env.docker}
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      TZ: America/Sao_Paulo
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./docker/postgres/init.sql:/docker-entrypoint-initdb.d/001-init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 20
    networks:
      - dominium

  cloud-api:
    build:
      context: ./cloud_api
    restart: unless-stopped
    env_file:
      - ${DOMINIUM_ENV_FILE:-.env.docker}
    environment:
      DB_HOST: postgres
      DB_PORT: "5432"
      DB_NAME: ${POSTGRES_DB}
      DB_USER: ${POSTGRES_USER}
      DB_PASSWORD: ${POSTGRES_PASSWORD}
      DOMINIUM_INGEST_TOKEN: ${DOMINIUM_INGEST_TOKEN}
      CORS_ORIGINS: ${CORS_ORIGINS}
      TZ: America/Sao_Paulo
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "127.0.0.1:${DOMINIUM_API_PORT:-8780}:8000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=3)"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks:
      - dominium

  n8n:
    image: docker.n8n.io/n8nio/n8n:latest
    restart: unless-stopped
    env_file:
      - ${DOMINIUM_ENV_FILE:-.env.docker}
    environment:
      DB_TYPE: postgresdb
      DB_POSTGRESDB_HOST: postgres
      DB_POSTGRESDB_PORT: "5432"
      DB_POSTGRESDB_DATABASE: ${POSTGRES_DB}
      DB_POSTGRESDB_USER: ${POSTGRES_USER}
      DB_POSTGRESDB_PASSWORD: ${POSTGRES_PASSWORD}
      DB_POSTGRESDB_SCHEMA: n8n
      N8N_ENCRYPTION_KEY: ${N8N_ENCRYPTION_KEY}
      N8N_HOST: ${N8N_HOST}
      N8N_PORT: "5678"
      N8N_PROTOCOL: ${N8N_PROTOCOL}
      N8N_EDITOR_BASE_URL: ${N8N_EDITOR_BASE_URL}
      N8N_WEBHOOK_URL: ${N8N_WEBHOOK_URL:-${WEBHOOK_URL:-http://localhost:5678/}}
      N8N_SECURE_COOKIE: ${N8N_SECURE_COOKIE}
      N8N_PROXY_HOPS: "1"
      N8N_DIAGNOSTICS_ENABLED: "false"
      N8N_PERSONALIZATION_ENABLED: "false"
      N8N_UNVERIFIED_PACKAGES_ENABLED: "false"
      N8N_CONCURRENCY_PRODUCTION_LIMIT: "1"
      EXECUTIONS_DATA_SAVE_ON_ERROR: "all"
      EXECUTIONS_DATA_SAVE_ON_SUCCESS: "none"
      EXECUTIONS_DATA_SAVE_ON_PROGRESS: "false"
      EXECUTIONS_DATA_PRUNE: "true"
      EXECUTIONS_DATA_MAX_AGE: "24"
      GENERIC_TIMEZONE: America/Sao_Paulo
      TZ: America/Sao_Paulo
    depends_on:
      postgres:
        condition: service_healthy
      cloud-api:
        condition: service_healthy
    ports:
      - "127.0.0.1:${N8N_LOCAL_PORT:-5678}:5678"
    volumes:
      - n8n_data:/home/node/.n8n
      - ./docker/n8n/workflows:/opt/dominium/workflows:ro
    networks:
      - dominium

  web:
    build:
      context: .
      dockerfile: docker/frontend.Dockerfile
    restart: unless-stopped
    depends_on:
      cloud-api:
        condition: service_healthy
    ports:
      - "127.0.0.1:${DOMINIUM_WEB_PORT:-8088}:80"
    networks:
      - dominium

  gateway:
    image: caddy:2-alpine
    profiles: ["production"]
    restart: unless-stopped
    env_file:
      - ${DOMINIUM_ENV_FILE:-.env.docker}
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - ./docker/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - web
      - n8n
    networks:
      - dominium

volumes:
  postgres_data:
  n8n_data:
  caddy_data:
  caddy_config:

networks:
  dominium:
    driver: bridge
