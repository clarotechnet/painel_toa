name: Publicar painel na Hostinger

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: hostinger-production
  cancel-in-progress: true

jobs:
  deploy:
    name: Build, teste e deploy
    runs-on: ubuntu-latest

    steps:
      - name: Baixar o codigo
        uses: actions/checkout@v4

      - name: Preparar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Instalar dependencias
        run: npm ci

      - name: Testar painel, extensoes e Cloud Bridge
        run: npm run test:web && npm run test:extension && npm run test:bridge && npm run test:cloud-bridge

      - name: Gerar site estatico
        run: npm run build

      - name: Validar artefato
        run: test -f dist/index.html && test -f dist/config.js && grep -q '?v=' dist/index.html

      - name: Publicar app Android na Central
        uses: appleboy/scp-action@v1
        with:
          host: ${{ secrets.HOSTINGER_FTP_SERVER }}
          username: ${{ secrets.HOSTINGER_FTP_USERNAME }}
          password: ${{ secrets.HOSTINGER_FTP_PASSWORD }}
          port: 65002
          source: "dist/mobile/*"
          target: "/home/u998431343/domains/clarotechnet.com.br/public_html/central/mobile"
          strip_components: 2
          overwrite: true
          timeout: 180s
          command_timeout: 10m
      - name: Enviar dist para public_html/central via SFTP
        id: deploy_primary
        continue-on-error: true
        uses: appleboy/scp-action@v1
        with:
          host: ${{ secrets.HOSTINGER_FTP_SERVER }}
          username: ${{ secrets.HOSTINGER_FTP_USERNAME }}
          password: ${{ secrets.HOSTINGER_FTP_PASSWORD }}
          port: 65002
          source: "dist/*"
          target: "/home/u998431343/domains/clarotechnet.com.br/public_html/central"
          strip_components: 1
          overwrite: true
          timeout: 180s
          command_timeout: 15m

      - name: Repetir envio se a Hostinger estiver lenta
        if: steps.deploy_primary.outcome == 'failure'
        uses: appleboy/scp-action@v1
        with:
          host: ${{ secrets.HOSTINGER_FTP_SERVER }}
          username: ${{ secrets.HOSTINGER_FTP_USERNAME }}
          password: ${{ secrets.HOSTINGER_FTP_PASSWORD }}
          port: 65002
          source: "dist/*"
          target: "/home/u998431343/domains/clarotechnet.com.br/public_html/central"
          strip_components: 1
          overwrite: true
          timeout: 180s
          command_timeout: 15m
