name: Publicar painel na Hostinger

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: hostinger-production
  cancel-in-progress: true

jobs:
  deploy:
    name: Build, teste e deploy
    runs-on: ubuntu-latest

    steps:
      - name: Baixar o codigo
        uses: actions/checkout@v4

      - name: Preparar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Instalar dependencias
        run: npm ci

      - name: Testar o painel
        run: npm run test:web

      - name: Gerar site estatico
        run: npm run build

      - name: Validar artefato
        run: test -f dist/index.html && test -f dist/config.js

      - name: Enviar dist para public_html/central via SFTP
        uses: appleboy/scp-action@v1
        with:
          host: ${{ secrets.HOSTINGER_FTP_SERVER }}
          username: ${{ secrets.HOSTINGER_FTP_USERNAME }}
          password: ${{ secrets.HOSTINGER_FTP_PASSWORD }}
          port: 65002
          source: "dist/*"
          target: "/home/u998431343/domains/clarotechnet.com.br/public_html/central"
          strip_components: 1
          overwrite: true
          timeout: 60s
          command_timeout: 10m
